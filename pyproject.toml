[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argbind"
version = "0.5.0"
description = "Simple way to bind function arguments to the command line."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Prem Seetharaman", email = "prem@descript.com"}]
keywords = ["command-line", "configuration", "yaml", "argument", "parsing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["pyyaml", "docstring-parser"]

[project.optional-dependencies]
tests = ["pytest", "pytest-cov", "torch", "torchvision"]
examples = ["torch", "torchvision"]

[project.urls]
Homepage = "https://github.com/pseeth/argbind/"

[tool.pytest.ini_options]
addopts = "--cov-report=term-missing --cov-report=xml --cov=argbind/"

[tool.coverage.report]
exclude_lines = ["raise NotImplementedError"]
