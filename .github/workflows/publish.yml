# Publish argbind-dbraun to PyPI when a `v*` tag is pushed, using PyPI
# Trusted Publishing (OIDC) — no API token is stored.
#
# To cut a release:
#   1. Bump `version` in pyproject.toml and update CHANGELOG.md, then commit.
#   2. Tag that commit and push the tag, e.g.:
#        git tag v0.5.2 && git push origin v0.5.2
#      Pushing a `v*` tag triggers this workflow, which runs `uv build` and
#      publishes the sdist + wheel via OIDC. The published version is taken
#      from pyproject.toml, so keep the tag in sync with it.
#   (To build the distributions locally without publishing: `uv build`.)
#
# One-time PyPI setup: register a trusted publisher (owner DBraun, repo argbind,
# workflow publish.yml, environment pypi). For the first release, before the
# project exists, use the pending-publisher form:
# https://pypi.org/manage/account/publishing/

name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/argbind-dbraun

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        python-version: "3.11"

    - name: Build package
      run: uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
