# Publish argbind-dbraun to PyPI when a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC) — no API token is stored.
#
# One-time PyPI setup: register a trusted publisher (owner DBraun, repo argbind,
# workflow publish.yml, environment pypi). For the first release, before the
# project exists, use the pending-publisher form:
# https://pypi.org/manage/account/publishing/

name: Publish

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/argbind-dbraun

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        python-version: "3.11"

    - name: Build package
      run: uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
