# Lint and test argbind-dbraun with uv, on pushes to main and pull requests.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        enable-cache: true
    - name: Ruff format check
      run: uvx ruff format --check .
    - name: Ruff lint
      run: uvx ruff check .

  # Fast, dependency-light suite (no torch) across all supported Pythons and OSes.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # Also exercise Windows and macOS on one version to catch path/encoding
        # issues (e.g. the $include path-resolution logic).
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        enable-cache: true
    - name: Test (excluding golden-file snapshots)
      run: uv run --python ${{ matrix.python-version }} --extra tests pytest -m "not snapshot"

  # Golden-file tests assert full CLI output, which varies by argparse/Python
  # version, so they run on a single canonical interpreter.
  snapshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        enable-cache: true
    - name: Snapshot tests
      run: uv run --python 3.12 --extra tests pytest -m snapshot
